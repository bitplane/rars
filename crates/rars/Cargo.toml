[package]
name = "rars"
version = "0.13.1"
description = "High-level Rust API for reading, extracting, writing, and repairing RAR archives."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
# Default builds retain all capabilities; each optional feature is independent.
default = ["write", "parallel", "recovery", "encryption"]
# Deprecated: does nothing beyond enabling `write`. Kept so 0.13.x stays
# compatible with 0.13.0; removed in 0.14.0 (#536).
experimental-ring-state = ["write"]
parallel = ["dep:rayon"]
recovery = ["dep:getrandom"]
write = ["dep:getrandom"]
encryption = ["dep:aes", "dep:hmac", "dep:sha1", "dep:sha2", "dep:zeroize"]

[dependencies]
aes = { workspace = true, optional = true }
aho-corasick.workspace = true
blake2s_simd.workspace = true
crc32fast.workspace = true
getrandom = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
memchr.workspace = true
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

# Bare WebAssembly cannot start a thread, so rayon's pool panics rather than
# running sequentially. `parallel.rs` has a single-threaded path for that target
# and rayon is left out of the build entirely.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
rayon = { workspace = true, optional = true }

# `getrandom` has no default entropy source on bare WebAssembly. RAR 5 header
# encryption needs one, so point it at the host's `crypto.getRandomValues`. The
# matching `--cfg getrandom_backend="wasm_js"` lives in `.cargo/config.toml`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, optional = true, features = ["wasm_js"] }

# In-place extraction opens without following links or waiting on FIFOs.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Windows has no zone database for `tzif` to read, so a legacy timestamp's
# offset comes from the system's own time zone settings through chrono's
# `Local`, which wraps them without `unsafe` here.
[target.'cfg(windows)'.dependencies]
chrono.workspace = true

# The PPMd model's pool is an anonymous mapping, so pages it never touches are
# never committed. Other targets keep a zeroed `Vec`.
[target.'cfg(any(unix, windows))'.dependencies]
memmap2.workspace = true

# Publishes a staged output with one rename that refuses an existing destination.
[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
rustix.workspace = true

# Criterion pulls in alloca, which builds C; the benches only target hosts with
# 64-bit atomics, so targets without them skip it and need no C cross-compiler.
[dev-dependencies]
# Tests ask the global pool how many threads extraction can really use.
rayon = { workspace = true }

[target.'cfg(target_has_atomic = "64")'.dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "chunk_sizes"
harness = false
required-features = ["write"]

[[bench]]
name = "parallel"
harness = false
required-features = ["write", "parallel"]

[[bench]]
name = "member_lookup"
harness = false
required-features = ["write"]

[[bench]]
name = "huffman_tables"
harness = false

[[bench]]
name = "streaming_decode"
harness = false
required-features = ["write"]

[[bench]]
name = "rar50_hash"
harness = false
required-features = ["write"]

[[bench]]
name = "huffman_decode"
harness = false
required-features = ["write"]

[[bench]]
name = "rar20_decode"
harness = false
required-features = ["write"]

[[bench]]
name = "delta_filter"
harness = false
required-features = ["write"]

[[bench]]
name = "recovery"
harness = false
required-features = ["write", "recovery", "parallel"]
