[package]
name = "rars-format"
version = "0.3.0"
description = "RAR archive format parser and writer implementation used by rars."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = false
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
fast = ["rars-codec/fast", "rars-crc32/fast"]
parallel = [
    "dep:rayon",
    "rars-codec/parallel",
    "rars-crc32/parallel",
    "rars-crypto/parallel",
    "rars-recovery/parallel",
]

[dependencies]
aho-corasick.workspace = true
getrandom.workspace = true
rayon = { workspace = true, optional = true }
rars-codec.workspace = true
rars-crypto.workspace = true
rars-crc32.workspace = true
rars-recovery.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parallel"
harness = false
