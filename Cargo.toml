[workspace]
members = [
    "crates/rars",
    "crates/rars-cli",
    "crates/rars-codec",
    "crates/rars-crypto",
    "crates/rars-crc32",
    "crates/rars-format",
    "crates/rars-recovery",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/bitplane/rars"
repository = "https://github.com/bitplane/rars"
documentation = "https://docs.rs/rars"
keywords = ["rar", "archive", "compression"]
categories = ["compression"]

[workspace.dependencies]
aes = { version = "0.8", features = ["zeroize"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
getrandom = "0.2"
hmac = "0.12"
libc = "0.2"
rars = { version = "0.1.0", path = "crates/rars" }
rars-codec = { version = "0.1.0", path = "crates/rars-codec" }
rars-crypto = { version = "0.1.0", path = "crates/rars-crypto" }
rars-crc32 = { version = "0.1.0", path = "crates/rars-crc32" }
rars-format = { version = "0.1.0", path = "crates/rars-format" }
rars-recovery = { version = "0.1.0", path = "crates/rars-recovery" }
rpassword = "7"
sha1 = "0.11"
sha2 = "0.11"
zeroize = { version = "1.8", default-features = false, features = ["alloc", "zeroize_derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
