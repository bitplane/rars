[workspace]
members = [
    "crates/rars",
    "crates/rars-cli",
    "crates/rars-python",
    "crates/rars-wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
readme = "README.md"
homepage = "https://bitplane.net/dev/rust/rars"
repository = "https://github.com/bitplane/rars"
documentation = "https://docs.rs/rars"
keywords = ["rar", "archive", "compression"]
categories = ["compression"]

[workspace.dependencies]
aes = { version = "0.9", features = ["zeroize"] }
aho-corasick = "1.1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
blake2s_simd = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crc32fast = "1.5"
chardetng = "1.0.0"
encoding_rs = "0.8.44"
getrandom = "0.4"
hmac = "0.13"
indicatif = "0.18.6"
js-sys = "0.3"
libc = "0.2"
memchr = "2.8"
memmap2 = "0.9.12"
pyo3 = "0.30.1"
rayon = "1.12.0"
rars = { version = "0.13.1", path = "crates/rars" }
rpassword = "7"
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
sha1 = "0.11"
sha2 = "0.11"
wasm-bindgen = "0.2"
zeroize = { version = "1.8", default-features = false, features = ["alloc", "zeroize_derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
# cargo-fuzz builds with --cfg fuzzing; rars exposes its RAR 3 VM to the fuzz
# targets under it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
# Keep symbols and line tables so crash reports from users are readable.
debug = "line-tables-only"
strip = "none"

# The npm package. `release` keeps line tables so a user's crash report is
# readable, which is right for a binary they run and wrong for a module they
# download: it was two thirds of the wasm. Speed stays at opt-level 3 because
# this profile builds a compressor, and `wasm-opt -Oz` in scripts/build-npm.sh
# takes the size back afterwards.
[profile.release-wasm]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The Python wheels, stripped for the same reason as the npm package: line
# tables were five sixths of the extension. No LTO: it saved under 1% and
# doubled the stack extraction needs, overflowing musl's 128 KiB thread stack.
[profile.release-python]
inherits = "release"
strip = true

# Key derivation and hashing run hundreds of thousands of rounds per volume, too slow unoptimised in tests.
[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.blake2s_simd]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.cipher]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.crypto-common]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.hybrid-array]
opt-level = 3

[profile.dev.package.inout]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# `just check` builds its tests here: the dev profile with rars and rars-cli at
# opt-level 1. On a 32-core machine the workspace tests went from 204-225 s to
# 75-86 s under cargo test (33-35 s under nextest), and a rebuild after an edit
# cost about the same CPU. It has its own target directory (target/fast-test),
# so switching between it and ordinary debug builds rebuilds neither, and debug
# builds keep opt-level 0 for stepping through. CI's Rust checks job gets the
# same opt-level from its runner config instead.
[profile.fast-test]
inherits = "dev"

[profile.fast-test.package.rars]
opt-level = 1

[profile.fast-test.package.rars-cli]
opt-level = 1
