[workspace]
members = [
    "crates/rars",
    "crates/rars-cli",
    "crates/rars-python",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/bitplane/rars"
repository = "https://github.com/bitplane/rars"
documentation = "https://docs.rs/rars"
keywords = ["rar", "archive", "compression"]
categories = ["compression"]

[workspace.dependencies]
aes = { version = "0.9", features = ["zeroize"] }
aho-corasick = "1.1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
getrandom = "0.4"
hmac = "0.13"
indicatif = "0.18.6"
libc = "0.2"
pyo3 = "0.29.0"
rayon = "1.12.0"
rars = { version = "0.7.2", path = "crates/rars" }
rpassword = "7"
sha1 = "0.11"
sha2 = "0.11"
zeroize = { version = "1.8", default-features = false, features = ["alloc", "zeroize_derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
# Keep symbols and line tables so crash reports from users are readable.
debug = "line-tables-only"
strip = "none"
