name: Install external decoders
description: >-
  Install unrar and the official 7zz, the decoders the write matrix hands every
  archive shape to. Both are pinned and checksummed: unrar comes from source
  because distributions ship unrar-free under the same name, which cannot read
  RAR 5, and 7-Zip comes from upstream because the Debian and Ubuntu package
  has the RAR decompressor removed. Linux x86-64 only.
runs:
  using: composite
  steps:
    - name: Install unrar
      shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        curl -sSfLO https://www.rarlab.com/rar/unrarsrc-7.1.6.tar.gz
        echo "ca5e1da37dd6fa1b78bb5ed675486413f79e4a917709744aa04b6f93dfd914f0  unrarsrc-7.1.6.tar.gz" | sha256sum -c -
        tar xf unrarsrc-7.1.6.tar.gz
        make -C unrar -j"$(nproc)"
        sudo install -m 0755 unrar/unrar /usr/local/bin/unrar
        unrar | head -2

    - name: Install 7-Zip
      shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        curl -sSfLO https://github.com/ip7z/7zip/releases/download/26.00/7z2600-linux-x64.tar.xz
        echo "c74dc4a48492cde43f5fec10d53fb2a66f520e4a62a69d630c44cb22c477edc6  7z2600-linux-x64.tar.xz" | sha256sum -c -
        mkdir -p 7zip && tar -C 7zip -xf 7z2600-linux-x64.tar.xz
        sudo install -m 0755 7zip/7zz /usr/local/bin/7zz
        7zz | head -2
