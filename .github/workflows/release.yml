name: Release

# A release is a merged pull request that changes the version (`just release`
# opens one). The first job works out whether this push did that and the version
# is not tagged yet; if not, everything else is skipped. The tag is pushed only
# once the test gate passes, and publishing waits for the release environment's
# approval.
#
# workflow_dispatch re-runs publishing for a version that is already tagged,
# when a registry failed part way through.
on:
  push:
    branches:
      - master
    paths:
      - "crates/*/Cargo.toml"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing release tag to publish, e.g. v0.13.0"
        required: true
      publish:
        description: "Release path to run"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - npm
          - all

# Default deny; each job re-grants only what it needs.
permissions: {}

# Releases must never be cancelled mid-flight. Each push gets its own group, so
# a later push to master cannot replace a release waiting for approval; two
# pushes racing to tag one version are settled by the tag push itself.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: rars
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

jobs:
  # ----------------------------------------------------------------------
  # 1. Decide whether this is a release, and check every publishable package
  #    declares the version being released. A push releases when it changed
  #    the version and that version has no tag; a dispatch republishes the
  #    tag it names.
  # ----------------------------------------------------------------------
  verify-tag:
    name: Decide the release and check package versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@stable

      - id: check
        name: Check versions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          package_version() {
            sed -n 's/^version = "\(.*\)"$/\1/p' | head -1
          }
          if [ "$EVENT" = workflow_dispatch ]; then
            TAG="${RELEASE_REF##*/}"            # v0.1.0-alpha.1
            TAG_VERSION="${TAG#v}"              # 0.1.0-alpha.1
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null \
              || { echo "::error::$TAG is not a tag"; exit 1; }
          else
            TAG_VERSION="$(package_version < crates/rars/Cargo.toml)"
            PREVIOUS=""
            if git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
              PREVIOUS="$(git show FETCH_HEAD:crates/rars/Cargo.toml | package_version)"
            fi
            if [ "$PREVIOUS" = "$TAG_VERSION" ]; then
              echo "Version $TAG_VERSION is unchanged; not a release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$TAG_VERSION" >/dev/null; then
              echo "v$TAG_VERSION is already tagged; not releasing it again."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Releasing $TAG_VERSION (was ${PREVIOUS:-unknown})."
          fi
          echo "version = $TAG_VERSION"

          cargo metadata --locked --no-deps --format-version 1 > metadata.json
          python3 - <<'PY' "$TAG_VERSION"
          import json
          import sys

          tag_version = sys.argv[1]
          metadata = json.load(open("metadata.json", encoding="utf-8"))
          packages = sorted(
              (package["name"], package["version"])
              for package in metadata["packages"]
          )
          mismatches = [
              (name, version)
              for name, version in packages
              if version != tag_version
          ]
          for name, version in packages:
              print(f"{name} = {version}")
          if mismatches:
              for name, version in mismatches:
                  print(
                      f"::error::{name} version {version} does not match tag {tag_version}"
                  )
              raise SystemExit(1)

          with open("pyproject.toml", "rb") as f:
              pyproject = __import__("tomllib").load(f)
          py_version = pyproject["project"]["version"]
          print(f"pyproject = {py_version}")
          if py_version != tag_version:
              print(
                  f"::error::pyproject version {py_version} does not match tag {tag_version}"
              )
              raise SystemExit(1)
          PY
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------------
  # 2. Re-run the suite as a release gate. Nothing else runs unless this is
  #    green.
  # ----------------------------------------------------------------------
  test:
    name: Test gate
    needs: verify-tag
    if: needs.verify-tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The write matrix hands every archive shape to a decoder we did not
      # write. Both are pinned and checksummed: unrar comes from source because
      # distributions ship unrar-free under the same name, which cannot read
      # RAR 5, and 7-Zip comes from upstream because the Debian and Ubuntu
      # package has the RAR decompressor removed.
      - name: Install unrar
        run: |
          set -euo pipefail
          curl -sSfLO https://www.rarlab.com/rar/unrarsrc-7.1.6.tar.gz
          echo "ca5e1da37dd6fa1b78bb5ed675486413f79e4a917709744aa04b6f93dfd914f0  unrarsrc-7.1.6.tar.gz" | sha256sum -c -
          tar xf unrarsrc-7.1.6.tar.gz
          make -C unrar -j"$(nproc)"
          sudo install -m 0755 unrar/unrar /usr/local/bin/unrar
          unrar | head -2

      - name: Install 7-Zip
        run: |
          set -euo pipefail
          curl -sSfLO https://github.com/ip7z/7zip/releases/download/26.00/7z2600-linux-x64.tar.xz
          echo "c74dc4a48492cde43f5fec10d53fb2a66f520e4a62a69d630c44cb22c477edc6  7z2600-linux-x64.tar.xz" | sha256sum -c -
          mkdir -p 7zip && tar -C 7zip -xf 7z2600-linux-x64.tar.xz
          sudo install -m 0755 7zip/7zz /usr/local/bin/7zz
          7zz | head -2

      # Python 3.10 is what the wheels target, so the gate builds the extension
      # against the oldest version it claims to support.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # The gate also builds the npm package and runs its checks, which needs a
      # wasm target, wasm-bindgen and Node. The wasm-bindgen version has to
      # match the crate the module was compiled against or the generated glue
      # will not load it, so it is pinned here and in Cargo.lock together.
      - name: Install wasm toolchain
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          WASM_BINDGEN_VERSION="$(python3 scripts/wasm-bindgen-version.py)"
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
          npm install --global binaryen@132
          wasm-bindgen --version
          wasm-opt --version

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The same script `just gate` runs. Spelling the steps out here again is
      # how the Python suite came to run in neither place: it was added to the
      # script nobody called, and CI had its own copy of the cargo commands that
      # knew nothing about it. One list, two callers.
      #
      # RARS_REQUIRE_EXTERNAL_DECODERS is set inside the script, so a missing
      # decoder fails the gate rather than skipping the matrix.
      - run: ./scripts/release-gate.sh

  # ----------------------------------------------------------------------
  # 2b. Tag the merge commit, now that the gate has passed on it. A tag that
  #     already exists fails the push, so of two runs racing for one version
  #     only one goes on to publish.
  # ----------------------------------------------------------------------
  tag:
    name: Tag the release
    needs: [verify-tag, test]
    if: github.event_name == 'push' && needs.verify-tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Push the tag
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

  # ----------------------------------------------------------------------
  # 3. Build release binaries for the supported targets.
  # ----------------------------------------------------------------------
  build:
    name: Build ${{ matrix.label }}
    needs: [verify-tag, test]
    if: github.event_name == 'push' || inputs.publish == 'all'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          - label: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          - label: macos-universal
            os: macos-latest
            target: universal2-apple-darwin
            setup: ""
          - label: windows-x86_64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            setup: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal needs both Apple targets; everything else just
          # needs its own.
          targets: ${{ matrix.target == 'universal2-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Platform setup
        if: matrix.setup != ''
        shell: bash
        run: ${{ matrix.setup }}

      # ---- Linux + Windows: build for the single target. ----
      - name: Build (single target)
        if: matrix.target != 'universal2-apple-darwin'
        shell: bash
        run: |
          cargo build --release --locked -p rars-cli --bin ${{ env.BIN_NAME }} --target ${{ matrix.target }}

      # ---- macOS: build twice, lipo into one universal binary. ----
      - name: Build (macOS universal)
        if: matrix.target == 'universal2-apple-darwin'
        run: |
          cargo build --release --locked -p rars-cli --bin ${{ env.BIN_NAME }} --target x86_64-apple-darwin
          cargo build --release --locked -p rars-cli --bin ${{ env.BIN_NAME }} --target aarch64-apple-darwin
          mkdir -p target/universal2-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/${{ env.BIN_NAME }} \
            target/aarch64-apple-darwin/release/${{ env.BIN_NAME }} \
            -output target/universal2-apple-darwin/release/${{ env.BIN_NAME }}
          file target/universal2-apple-darwin/release/${{ env.BIN_NAME }}

      # ---- Stage the binary into a release dir alongside LICENSE etc. ----
      - name: Stage release files (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGE="${{ env.BIN_NAME }}-${{ needs.verify-tag.outputs.version }}-${{ matrix.label }}"
          mkdir -p "dist/$STAGE"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "dist/$STAGE/"
          if [ -f LICENSE ]; then cp LICENSE "dist/$STAGE/"; fi
          if [ -f README.md ]; then cp README.md "dist/$STAGE/"; fi
          tar -C dist -czf "dist/$STAGE.tar.gz" "$STAGE"
          ls -la dist/

      - name: Stage release files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "$env:BIN_NAME-${{ needs.verify-tag.outputs.version }}-${{ matrix.label }}"
          New-Item -ItemType Directory -Path "dist\$stage" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\$env:BIN_NAME.exe" "dist\$stage\"
          if (Test-Path LICENSE)   { Copy-Item LICENSE   "dist\$stage\" }
          if (Test-Path README.md) { Copy-Item README.md "dist\$stage\" }
          Compress-Archive -Path "dist\$stage" -DestinationPath "dist\$stage.zip"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ needs.verify-tag.outputs.version }}-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------------------
  # 4. Build Python wheels and an sdist for PyPI with cibuildwheel, which
  #    reads its build list from pyproject.toml. The extension uses
  #    abi3-py310, so each platform gets one wheel, and every CPython from
  #    3.10 runs python/tests against it. Linux builds both manylinux and
  #    musllinux.
  # ----------------------------------------------------------------------
  build-python-wheels:
    name: Build Python ${{ matrix.label }}
    needs: [verify-tag, test]
    if: github.event_name == 'push' || inputs.publish == 'pypi' || inputs.publish == 'all'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            archs: x86_64
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            archs: aarch64
          - label: macos-universal2
            os: macos-latest
            archs: universal2
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - label: windows-x86_64
            os: windows-latest
            archs: AMD64
            rust-targets: x86_64-pc-windows-msvc
          - label: windows-arm64
            os: windows-11-arm
            archs: ARM64
            rust-targets: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      # Linux builds inside the manylinux and musllinux containers, which
      # install Rust themselves (pyproject.toml's before-all).
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          targets: ${{ matrix.rust-targets }}

      # pyproject.toml builds Linux wheels with build[uv], and cibuildwheel
      # then repairs them in a uv virtualenv on the host.
      - uses: astral-sh/setup-uv@v10.4.0
        if: runner.os == 'Linux'

      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          # rars reads no Windows time zone and converts legacy times as UTC,
          # so the tests' local times must be UTC too (see #634).
          CIBW_ENVIRONMENT_WINDOWS: TZ=UTC0
        with:
          output-dir: dist

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ needs.verify-tag.outputs.version }}-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-python-sdist:
    name: Build Python sdist
    needs: [verify-tag, test]
    if: github.event_name == 'push' || inputs.publish == 'pypi' || inputs.publish == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload Python sdist
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ needs.verify-tag.outputs.version }}-sdist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------------------
  # 4b. Build the npm package. One WebAssembly module serves every platform,
  #     so unlike the wheels this is a single job with no matrix.
  # ----------------------------------------------------------------------
  build-npm:
    name: Build npm package
    needs: [verify-tag, test]
    if: github.event_name == 'push' || inputs.publish == 'npm' || inputs.publish == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install wasm tooling
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="$(python3 scripts/wasm-bindgen-version.py)"
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
          npm install --global binaryen@132

      - run: ./scripts/build-npm.sh

      # Building and testing in one job so the tarball that gets published is
      # the one the checks ran against, byte for byte.
      - run: node scripts/test-npm-package.js

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist ./npm
          ls -la dist/

      - name: Upload npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ needs.verify-tag.outputs.version }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------------------
  # 5. Publish to crates.io, PyPI and npm, in that order, from one job.
  #
  #    The `release` environment holds CARGO_REGISTRY_TOKEN and is the PyPI
  #    and npm trusted publisher. It needs a reviewer's approval, and GitHub
  #    asks once per job, so all three registries share this job: one click
  #    publishes the release. A failed step stops the later registries.
  #
  #    A dispatch with `pypi` or `npm` publishes only that registry; its
  #    build jobs run and the others are skipped.
  # ----------------------------------------------------------------------
  publish:
    name: Publish to crates.io, PyPI and npm
    needs: [verify-tag, test, tag, build-python-wheels, build-python-sdist, build-npm]
    if: >-
      always()
      && needs.verify-tag.result == 'success'
      && needs.verify-tag.outputs.release == 'true'
      && needs.test.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      CRATES: ${{ github.event_name == 'push' || inputs.publish == 'all' }}
      PYPI: ${{ github.event_name == 'push' || inputs.publish == 'pypi' || inputs.publish == 'all' }}
      NPM: ${{ github.event_name == 'push' || inputs.publish == 'npm' || inputs.publish == 'all' }}
    steps:
      # crates.io, in dependency order.
      - uses: actions/checkout@v7
        if: env.CRATES == 'true'
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@stable
        if: env.CRATES == 'true'

      - uses: Swatinem/rust-cache@v2
        if: env.CRATES == 'true'

      - name: Publish crates
        if: env.CRATES == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish() {
            local package="$1"
            local log
            log="$(mktemp)"
            echo "::group::Publishing $package"
            for attempt in 1 2 3 4 5; do
              if cargo publish --locked -p "$package" 2>&1 | tee "$log"; then
                echo "::endgroup::"
                rm -f "$log"
                return 0
              fi
              if grep -Eq "crate .+@.+ already exists on crates.io index|crate version .+ is already uploaded" "$log"; then
                echo "$package is already published; continuing"
                echo "::endgroup::"
                rm -f "$log"
                return 0
              fi
              if [ "$attempt" = 5 ]; then
                echo "::endgroup::"
                rm -f "$log"
                return 1
              fi
              echo "Publish failed for $package; waiting for registry/index propagation before retry $((attempt + 1))"
              sleep 30
            done
            echo "::endgroup::"
            rm -f "$log"
          }

          publish rars
          publish rars-cli

      # PyPI, by trusted publishing. The wheels get their own directory, kept
      # apart from the npm tarball: the publish action uploads everything in it.
      - name: Download Python artifacts
        if: env.PYPI == 'true'
        uses: actions/download-artifact@v8
        with:
          path: pypi-dist
          pattern: python-${{ needs.verify-tag.outputs.version }}-*
          merge-multiple: true

      - name: Publish Python package
        if: env.PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist
          skip-existing: true

      # npm, by trusted publishing. That needs the package to already exist
      # and to have this repository registered as its publisher, so the very
      # first version went up by hand with `npm publish`. `id-token: write`
      # mints the provenance attestation.
      - uses: actions/setup-node@v7
        if: env.NPM == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer to mint the OIDC token.
      # Node 22 ships npm 10.
      - name: Update npm
        if: env.NPM == 'true'
        run: npm install --global npm@latest

      - name: Download npm artifact
        if: env.NPM == 'true'
        uses: actions/download-artifact@v8
        with:
          name: npm-${{ needs.verify-tag.outputs.version }}
          path: npm-dist

      # No token: npm trusted publishing exchanges the workflow's OIDC identity
      # for a short-lived credential, and attaches a provenance attestation
      # saying which commit and workflow built the tarball. Set that up once, in
      # the package's settings on npmjs.com, pointing at this repository and
      # this workflow file. NPM_TOKEN is the fallback for when that is not
      # configured yet.
      #
      # Republishing a version npm already has is an error, and a re-run of a
      # release should not fail on it, so ask first.
      - name: Publish npm package
        if: env.NPM == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@bitplane/rars@$VERSION" version >/dev/null 2>&1; then
            echo "@bitplane/rars@$VERSION is already published; nothing to do"
            exit 0
          fi
          # The leading ./ is load-bearing. npm parses a bare `npm-dist/foo.tgz`
          # as the git shorthand `github:npm-dist/foo.tgz` and refuses it with
          # EALLOWGIT; only an explicit relative or absolute path is read as a
          # file. npm pack flattens the scope into the filename.
          npm publish --provenance --access public "./npm-dist/bitplane-rars-$VERSION.tgz"

  # ----------------------------------------------------------------------
  # 6. Publish the packaged binaries to the tagged GitHub Release.
  # ----------------------------------------------------------------------
  publish-github-release:
    name: Publish GitHub Release
    needs: [verify-tag, build, publish]
    if: github.event_name == 'push' || inputs.publish == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verify-tag.outputs.version }}
          name: ${{ env.BIN_NAME }} ${{ needs.verify-tag.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify-tag.outputs.version, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.whl
            dist/*.tgz
