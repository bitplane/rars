name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its last run. Pushes to master all
# finish: each one saves the dependency caches pull requests restore, and a
# cancelled run saves nothing.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # File and line in backtraces, without the full debug info that dominates
  # compile and link time for test binaries.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  msrv:
    name: Minimum Rust (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Name the toolchain as an input: Dependabot treats a version in the
      # action ref as the action's own version and "upgrades" it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: |
            . -> target
            scripts/reader-consumer -> target
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check workspace and independent readers at the minimum compiler version
        run: |
          cargo check --workspace --lib --bins --locked
          cargo check --locked --manifest-path scripts/reader-consumer/Cargo.toml
          cargo check --locked --manifest-path scripts/reader-consumer/Cargo.toml --features encryption

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Dependencies only: rust-cache drops the workspace's own crates. Pull
      # requests restore master's cache and do not save their own, which keeps
      # the repository under its cache quota. Every Rust job below does the same.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@nextest

      # Test runs dominate this job, and unoptimised rars spends them decoding.
      # Only here: jobs that build with one core or run few tests got slower.
      # Local debug builds keep opt-level 0 for debugging and fast rebuilds.
      - name: Optimise the rars crates in test builds
        shell: bash
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          printf '[profile.dev.package.rars]\nopt-level = 1\n[profile.dev.package.rars-cli]\nopt-level = 1\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"

      # The workspace includes PyO3 tests that embed Python.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path scripts/reader-consumer/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Unit and integration tests, every binary at once rather than one after
      # another; nextest does not run doctests, so they follow. External-decoder
      # tests skip unavailable tools; the release gate requires them.
      - name: Tests
        run: |
          cargo nextest run --workspace --locked --no-fail-fast
          cargo test --workspace --locked --doc

      # The tests already built the CLI with the workspace's features; building
      # it alone would rebuild rars with a different feature set.
      - name: Frozen runner real-binary smoke and portable checks
        env:
          RARS_SMOKE_BINARY: ${{ github.workspace }}/target/debug/rars
        run: |
          cargo build --workspace --bins --locked
          python3 -m unittest discover -s scripts/hybrid -v

  python:
    name: Python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The oldest version the abi3 wheels claim to support.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # Several tests check rewritten archives with unrar and skip without it.
      # Built from source like the release gate: Ubuntu's unrar-free cannot
      # read RAR 5. Each OS caches its own binary and both share the source
      # download, whose hash is checked whenever a build needs it.
      - id: unrar-cache
        uses: actions/cache@v6
        with:
          path: ~/unrar-bin
          key: unrar-7.1.6-${{ runner.os }}-${{ runner.arch }}-ca5e1da37dd6fa1b78bb5ed675486413f79e4a917709744aa04b6f93dfd914f0

      - if: steps.unrar-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/rarlab-downloads
          key: unrarsrc-7.1.6-ca5e1da37dd6fa1b78bb5ed675486413f79e4a917709744aa04b6f93dfd914f0
          enableCrossOsArchive: true

      - name: Fetch unrar source
        if: steps.unrar-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/rarlab-downloads
          cd ~/rarlab-downloads
          [ -f unrarsrc-7.1.6.tar.gz ] || curl -sSfLO https://www.rarlab.com/rar/unrarsrc-7.1.6.tar.gz
          echo "ca5e1da37dd6fa1b78bb5ed675486413f79e4a917709744aa04b6f93dfd914f0  unrarsrc-7.1.6.tar.gz" | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          tar xf ~/rarlab-downloads/unrarsrc-7.1.6.tar.gz
          mkdir -p ~/unrar-bin

      - name: Build unrar
        if: runner.os == 'Linux' && steps.unrar-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          make -C unrar -j"$(nproc)"
          cp unrar/unrar ~/unrar-bin/unrar

      # The project targets an old toolset and SDK, so build with the runner's.
      - name: Build unrar
        if: runner.os == 'Windows' && steps.unrar-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild unrar\UnRAR.vcxproj -m -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -p:WindowsTargetPlatformVersion=10.0
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed: $LASTEXITCODE" }
          Copy-Item unrar\build\unrar64\Release\UnRAR.exe "$HOME\unrar-bin\unrar.exe"

      - name: Install unrar
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo install -m 0755 ~/unrar-bin/unrar /usr/local/bin/unrar
          unrar | head -2

      - name: Install unrar
        if: runner.os == 'Windows'
        run: |
          "$HOME\unrar-bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          if (-not (Test-Path "$HOME\unrar-bin\unrar.exe")) { throw 'unrar.exe not built' }

      # Until this job existed the suite only ran in the release gate, so a
      # change could break it on master without any PR showing a failure.
      - name: Build the extension and run python/tests
        run: python scripts/test-python-bindings.py

  npm:
    name: npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # build-npm.sh reads the wasm-bindgen version from Cargo.lock.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The generated glue only loads a module built against the same
      # wasm-bindgen crate, so the CLI version follows Cargo.lock. wasm-opt
      # is left out: build-npm.sh ships unoptimised modules without it, which
      # is enough to test them.
      - name: Install wasm-bindgen
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version "$(python3 scripts/wasm-bindgen-version.py)" --locked
          wasm-bindgen --version

      # Until this job existed the npm checks only ran in the release gate, so
      # a change could break them on master without any PR showing a failure.
      - name: Build the npm package and run its checks
        run: |
          ./scripts/build-npm.sh
          node scripts/test-npm-package.js

  native-cli:
    name: Native CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Test the CLI on the native filesystem
        run: cargo test -p rars-cli --locked

  reader-features:
    name: Independent reader feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 2
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The consumer builds under target/, which this caches.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path scripts/reader-consumer/Cargo.toml
      - name: Check independent reader consumer and dependency exclusions
        run: python3 scripts/check-reader-features.py

  reader-targets:
    name: Reader target (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, i686-unknown-linux-musl]
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check minimal and encrypted readers without workspace unification
        run: |
          cargo check --locked --manifest-path scripts/reader-consumer/Cargo.toml --target '${{ matrix.target }}'
          cargo check --locked --manifest-path scripts/reader-consumer/Cargo.toml --target '${{ matrix.target }}' --features encryption
      - name: Check full library
        run: cargo check -p rars --lib --locked --target '${{ matrix.target }}'

  portable-atomics:
    name: Library and CLI without 64-bit atomics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: powerpc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Criterion's alloca dependency builds C even during cargo check.
      - name: Install PowerPC C compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-powerpc-linux-gnu
      # Compile the binary and tests on a target that exercises the mutex
      # fallback, without needing an emulator to run them.
      - name: Check library, CLI and tests
        run: cargo check -p rars -p rars-cli --all-targets --locked --target powerpc-unknown-linux-gnu

  # Every optional-feature combination of the library, without workspace
  # feature unification. Running the unit tests is most of each set's time, so
  # every write set gets a job of its own; the read and recovery sets are
  # quicker and share two jobs, reusing their dependency builds.
  unit-features:
    name: Library unit features (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: read
            features: none parallel encryption encryption,parallel
          - group: recovery
            features: recovery recovery,parallel recovery,encryption recovery,encryption,parallel
          - group: write
            features: write
            memory: write
          - group: write,parallel
            features: write,parallel
            memory: write,parallel
          - group: write,encryption
            features: write,encryption
          - group: write,encryption,parallel
            features: write,encryption,parallel
          - group: write,recovery
            features: write,recovery
          - group: write,recovery,parallel
            features: write,recovery,parallel
          - group: write,recovery,encryption
            features: write,recovery,encryption
          - group: write,recovery,encryption,parallel
            features: write,recovery,encryption,parallel
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 4
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          key: ${{ matrix.group }}
      - name: Lint and test the library without workspace feature unification
        env:
          SETS: ${{ matrix.features }}
        run: |
          set -euo pipefail
          for features in $SETS; do
            python3 scripts/check-unit-features.py --features "$features"
          done
      - name: Check encoder memory bounds without workspace feature unification
        if: matrix.memory != ''
        env:
          SETS: ${{ matrix.memory }}
        run: |
          set -euo pipefail
          for features in $SETS; do
            cargo test -p rars --locked --no-default-features --features "$features" --test encoder_memory_regression
          done
