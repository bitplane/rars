name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum Rust (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Name the toolchain as an input: Dependabot treats a version in the
      # action ref as the action's own version and "upgrades" it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check workspace and independent readers at the minimum compiler version
        run: |
          cargo check --workspace --lib --bins --locked
          cargo check --locked --manifest-path scripts/reader-consumer/Cargo.toml
          cargo check --locked --manifest-path scripts/reader-consumer/Cargo.toml --features encryption

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Test runs dominate CI, and unoptimised rars spends them decoding. Local
      # debug builds keep opt-level 0 for debugging and fast rebuilds.
      - name: Optimise the rars crates in test builds
        shell: bash
        run: printf '[profile.dev.package.rars]\nopt-level = 1\n[profile.dev.package.rars-cli]\nopt-level = 1\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"

      # The workspace includes PyO3 tests that embed Python.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path scripts/reader-consumer/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes unit, integration and doc tests, but does not run benchmarks.
      # External-decoder tests skip unavailable tools; the release gate requires them.
      - name: Tests
        run: cargo test --workspace --locked

      - name: Frozen runner real-binary smoke and portable checks
        env:
          RARS_SMOKE_BINARY: ${{ github.workspace }}/target/debug/rars
        run: |
          cargo build -p rars-cli --locked
          python3 -m unittest discover -s scripts/hybrid -v

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # The oldest version the abi3 wheels claim to support.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # Several tests check rewritten archives with unrar and skip without it.
      # Built from source like the release gate: Ubuntu's unrar-free cannot
      # read RAR 5.
      - name: Install unrar
        run: |
          set -euo pipefail
          curl -sSfLO https://www.rarlab.com/rar/unrarsrc-7.1.6.tar.gz
          echo "ca5e1da37dd6fa1b78bb5ed675486413f79e4a917709744aa04b6f93dfd914f0  unrarsrc-7.1.6.tar.gz" | sha256sum -c -
          tar xf unrarsrc-7.1.6.tar.gz
          make -C unrar -j"$(nproc)"
          sudo install -m 0755 unrar/unrar /usr/local/bin/unrar
          unrar | head -2

      # Until this job existed the suite only ran in the release gate, so a
      # change could break it on master without any PR showing a failure.
      - name: Build the extension and run python/tests
        run: python3 scripts/test-python-bindings.py

  npm:
    name: npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # build-npm.sh reads the wasm-bindgen version from Cargo.lock.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The generated glue only loads a module built against the same
      # wasm-bindgen crate, so the CLI version follows Cargo.lock. wasm-opt
      # is left out: build-npm.sh ships unoptimised modules without it, which
      # is enough to test them.
      - name: Install wasm-bindgen
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version "$(python3 scripts/wasm-bindgen-version.py)" --locked
          wasm-bindgen --version

      # Until this job existed the npm checks only ran in the release gate, so
      # a change could break them on master without any PR showing a failure.
      - name: Build the npm package and run its checks
        run: |
          ./scripts/build-npm.sh
          node scripts/test-npm-package.js

  native-cli:
    name: Native CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Optimise the rars crates in test builds
        shell: bash
        run: printf '[profile.dev.package.rars]\nopt-level = 1\n[profile.dev.package.rars-cli]\nopt-level = 1\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - name: Test the CLI on the native filesystem
        run: cargo test -p rars-cli --locked

  reader-features:
    name: Independent reader feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 2
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path scripts/reader-consumer/Cargo.toml
      - name: Check independent reader consumer and dependency exclusions
        run: python3 scripts/check-reader-features.py

  reader-targets:
    name: Reader target (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, i686-unknown-linux-musl]
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check minimal and encrypted readers without workspace unification
        run: |
          cargo check --locked --manifest-path scripts/reader-consumer/Cargo.toml --target '${{ matrix.target }}'
          cargo check --locked --manifest-path scripts/reader-consumer/Cargo.toml --target '${{ matrix.target }}' --features encryption
      - name: Check full library
        run: cargo check -p rars --lib --locked --target '${{ matrix.target }}'

  portable-atomics:
    name: Library and CLI without 64-bit atomics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: powerpc-unknown-linux-gnu
      # Criterion's alloca dependency builds C even during cargo check.
      - name: Install PowerPC C compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-powerpc-linux-gnu
      # Compile the binary and tests on a target that exercises the mutex
      # fallback, without needing an emulator to run them.
      - name: Check library, CLI and tests
        run: cargo check -p rars -p rars-cli --all-targets --locked --target powerpc-unknown-linux-gnu

  unit-features:
    name: Library unit features (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        features:
          - none
          - parallel
          - encryption
          - encryption,parallel
          - recovery
          - recovery,parallel
          - recovery,encryption
          - recovery,encryption,parallel
          - write
          - write,parallel
          - write,encryption
          - write,encryption,parallel
          - write,recovery
          - write,recovery,parallel
          - write,recovery,encryption
          - write,recovery,encryption,parallel
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 2
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Optimise the rars crates in test builds
        shell: bash
        run: printf '[profile.dev.package.rars]\nopt-level = 1\n[profile.dev.package.rars-cli]\nopt-level = 1\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - name: Test the library without workspace feature unification
        run: python3 scripts/check-unit-features.py --features '${{ matrix.features }}'
      - name: Check encoder memory bounds without workspace feature unification
        if: matrix.features == 'write' || matrix.features == 'write,parallel'
        run: cargo test -p rars --locked --no-default-features --features '${{ matrix.features }}' --test encoder_memory_regression
